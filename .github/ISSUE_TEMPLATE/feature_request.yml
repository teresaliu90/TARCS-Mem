name: Feature proposal
description: Propose a reusable, evidence-backed improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem and users
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior and threat model
      description: Explain effects on evidence governance, tenant isolation, classification and cloud egress.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evaluation plan
      description: State tests, dataset/benchmark and success criteria.
    validations:
      required: true
