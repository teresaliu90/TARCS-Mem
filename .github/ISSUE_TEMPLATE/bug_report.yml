name: Bug report
description: Report a reproducible TARCS-Mem behavior problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Do not include API keys, customer documents, PII or internal policy text.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected governance behavior
      description: Include status, valid date, tenant/role expectation, classification and expected abstention if relevant.
    validations:
      required: true
