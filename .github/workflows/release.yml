name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: pip install -e '.[dev,api,mcp,integrations]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Verify tag matches package version
        run: python -c "import os, tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version"
      - run: python -m build
      - name: Add evidence artifacts
        run: |
          cp docs/benchmarks/fiqa-public-report.json dist/
          cp docs/demo/tarcsmem-v0.7-demo.mp4 dist/tarcsmem-demo.mp4
          cd dist
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          generate_release_notes: true
